<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DİM Üslublu Onlayn İmtahan Sistemi</title>
    
    <!-- Supabase JavaScript SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; line-height: 1.5; -webkit-user-select: none; user-select: none; }
        .container { max-width: 1100px; margin: 20px auto; padding: 20px; }
        .card { background: #ffffff; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 25px; margin-bottom: 20px; }
        
        /* Ekranlar */
        #login-screen, #exam-screen, #result-screen, #admin-panel { display: none; }
        
        /* Giriş Paneli */
        .login-box { max-width: 400px; margin: 80px auto; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
        .btn { background: #2563eb; color: #fff; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn:hover { background: #1d4ed8; }
        .error-msg { color: #ef4444; margin-top: 10px; font-size: 14px; }
        
        /* Header və Taymer */
        .exam-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        .timer-box { font-size: 20px; font-weight: bold; color: #dc2626; background: #fef2f2; padding: 8px 16px; border-radius: 6px; border: 1px solid #fca5a5; }
        
        /* Əsas Şəbəkə */
        .exam-layout { display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
        
        /* Naviqasiya Paneli */
        .grid-nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-height: 450px; overflow-y: auto; padding-right: 5px; }
        .nav-box { width: 100%; height: 38px; border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; border-radius: 4px; background: #fff; font-size: 13px; }
        .nav-box.answered { background: #22c55e; color: #fff; border-color: #16a34a; }
        .nav-box.flagged { background: #eab308; color: #fff; border-color: #ca8a04; }
        .nav-box.current { border: 2px solid #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.2); }
        .collapsed { display: none; }
        
        /* Sual Bölməsi */
        .question-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .question-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; white-space: pre-line; }
        .question-img { max-width: 100%; height: auto; margin: 15px 0; border-radius: 6px; border: 1px solid #e2e8f0; }
        .options label { display: block; padding: 12px; margin-bottom: 8px; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .options label:hover { background: #f1f5f9; }
        .options input { margin-right: 10px; }
        .clear-option-btn { background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-top: 10px; }
        
        /* Düymələr */
        .nav-btns { display: flex; justify-content: space-between; margin-top: 20px; }
        .btn-secondary { background: #64748b; color: white; padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; }
        .btn-finish { background: #dc2626; color: white; padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        
        /* DİM Protokolu (Nəticə) */
        .dim-report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-top: 20px; }
        .dim-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
        .dim-table th, .dim-table td { border: 1px solid #cbd5e1; padding: 4px 6px; text-align: center; }
        .dim-table th { background: #f1f5f9; }
        .ans-correct { background-color: #dcfce7; color: #15803d; font-weight: bold; }
        .ans-wrong { background-color: #fee2e2; color: #b91c1c; font-weight: bold; }
        
        /* Admin Cədvəli */
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .admin-table th, .admin-table td { padding: 10px; border: 1px solid #cbd5e1; text-align: left; }
        .admin-table th { background: #f8fafc; }
        .stat-card { background: #eff6ff; border: 1px solid #bfdbfe; padding: 15px; border-radius: 6px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. GİRİŞ EKRANI -->
    <div id="login-screen" class="card login-box" style="display: block;">
        <h2>İmtahana Giriş</h2>
        <br>
        <input type="text" id="user-name" placeholder="Ad və Soyad" autocomplete="off">
        <input type="text" id="user-token" placeholder="Unikal Kod (Məs: P7GS57)" autocomplete="off">
        <button class="btn" onclick="startExam()">İmtahana Başla</button>
        <div id="error-msg" class="error-msg"></div>
    </div>

    <!-- 2. İMTAHAN EKRANI -->
    <div id="exam-screen">
        <div class="card">
            <div class="exam-header">
                <div>
                    <h3 id="student-display-name">Tələbə</h3>
                    <span style="font-size: 12px; color: #64748b;">DİM Onlayn Sınaq İnterfeysi</span>
                </div>
                <div class="timer-box" id="timer">03:00:00</div>
            </div>

            <div class="exam-layout">
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <strong>Suallar</strong>
                        <button id="toggle-btn" onclick="toggleSidebar()" style="border:none; background:none; color:#2563eb; cursor:pointer; font-size:12px;">Yığ [-]</button>
                    </div>
                    <div id="grid-nav-container" class="grid-nav"></div>
                </div>

                <div>
                    <div id="single-question-container"></div>
                    <div class="nav-btns">
                        <button class="btn-secondary" onclick="prevQuestion()">Əvvəlki</button>
                        <button class="btn-secondary" onclick="nextQuestion()">Növbəti</button>
                        <button class="btn-finish" onclick="confirmFinish()">İmtahanı Bitir</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. NƏTİCƏ EKRANI (DİM Protokolu) -->
    <div id="result-screen" class="card">
        <h2>İmtahan Nəticəsi - DİM Protokolu</h2>
        <p style="margin-top: 5px; color: #475569;">İştirakçı: <strong id="res-name">-</strong></p>
        
        <div style="display: flex; gap: 20px; margin: 15px 0; font-size: 14px;">
            <div>Doğru: <strong id="res-total-correct" style="color: green;">0</strong></div>
            <div>Səhv: <strong id="res-total-wrong" style="color: red;">0</strong></div>
            <div>Boş: <strong id="res-total-blank">0</strong></div>
            <div>Yekun Bal: <strong id="res-total-score" style="color: #2563eb; font-size: 16px;">0</strong></div>
        </div>

        <div style="font-weight: bold; padding: 10px; background: #f1f5f9; border-radius: 6px;" id="res-bb-group">-</div>

        <div id="dim-report-content" class="dim-report-grid"></div>

        <div style="margin-top: 20px;">
            <button class="btn-secondary" onclick="backToReviewQuestions()">Suallara və Cavablara Bax</button>
        </div>
    </div>

    <!-- 4. ADMİN PANELİ -->
    <div id="admin-panel" class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Admin İdarəetmə Paneli</h2>
            <button class="btn-secondary" onclick="closeAdminPanel()">Çıxış</button>
        </div>

        <div style="display: flex; gap: 15px;">
            <div class="stat-card" style="flex:1;">İştirakçı Sayı: <strong id="stat-total-students">0</strong></div>
            <div class="stat-card" style="flex:1;">Ən Yüksək Bal: <strong id="stat-max-score">0</strong></div>
            <div class="stat-card" style="flex:1;">Orta Bal: <strong id="stat-avg-score">0</strong></div>
        </div>

        <div style="margin: 15px 0; text-align: right;">
            <button style="background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;" onclick="clearResults()">Bütün Nəticələri Sil</button>
        </div>

        <table class="admin-table">
            <thead>
                <tr>
                    <th>Ad Soyad</th>
                    <th>Kod</th>
                    <th>D</th>
                    <th>S</th>
                    <th>Bal</th>
                    <th>Təyin Edilən Qrup</th>
                </tr>
            </thead>
            <tbody id="results-table-body">
                <tr><td colspan="6">Məlumatlar yüklənir...</td></tr>
            </tbody>
        </table>
    </div>

</div>

<script>
// --- SUPABASE İNİSİALİZASİYASI ---
const SUPABASE_URL = "https://1clDyHhxAiSCurwGHwMi3g.supabase.co";
const SUPABASE_KEY = "sb_publishable_1clDyHhxAiSCurwGHwMi3g_rrs17eYF";

// Supabase istemcisi
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Təhlükəsizlik tənzimləmələri
document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'x' || e.key === 'u' || e.key === 's' || e.key === 'a')) {
        e.preventDefault();
        alert("Bu əməliyyat məxfilik məqsədilə qadağandır!");
    }
    if (e.key === 'PrintScreen') {
        navigator.clipboard.writeText('');
        alert("Ekran görüntüsü çəkmək qadağandır!");
    }
});

const validTokens = ["P7GS57", "K9X2M4", "B3R8L9", "H2V5N1", "H7V7N", "T6Z4Q8", "H27V5N1", "T67Z4Q8"];
const ADMIN_PASS = "6675157";
const testDuration = 3 * 3600;

// Nümunə Suallar Siyahısı (Öz suallarınızı buraya əlavə edə bilərsiniz)
const allQuestions = [
    { id: 1, subject: "Azərbaycan dili", question: "Hansı sözdə vurğu birinci hecaya düşür?", options: ["Lakin", "Böyük", "Yaxşı", "Sarı"], correct: 0 },
    { id: 2, subject: "Azərbaycan dili", question: "Sinonim sözlər cütlüyünü seçin:", options: ["Ağ - Qara", "Gözəl - Qəşəng", "Uzun - Qısa", "Böyük - Kiçik"], correct: 1 },
    { id: 3, subject: "Qanunvericilik", question: "Azərbaycan Respublikasının Konstitusiyası nə vaxt qəbul edilmişdir?", options: ["12 noyabr 1995", "18 oktyabr 1991", "28 may 1918", "31 dekabr 1989"], correct: 0 },
    { id: 4, subject: "İnformatika", question: "Aşağıdakılardan hansı daxiletmə qurğusudur?", options: ["Monitor", "Printer", "Klaviatura", "Səs ucaldan"], correct: 2 },
    { id: 5, subject: "Məntiq", question: "Ardıcıllıqdakı növbəti ədədi tapın: 2, 4, 8, 16, ?", options: ["20", "24", "32", "64"], correct: 2 }
];

let currentStudentName = "";
let currentActiveToken = "";
let userAnswers = {};
let flaggedQuestions = {};
let currentQuestionIndex = 0;
let timerInterval;
let timeLeft = testDuration;
let examFinished = false;

window.addEventListener('load', function() {
    if (window.location.hash === "#admin") {
        openAdminLogin();
        return;
    }

    let savedSession = sessionStorage.getItem("active_exam_session");
    if (savedSession) {
        let sessionData = JSON.parse(savedSession);
        currentStudentName = sessionData.name;
        currentActiveToken = sessionData.token;
        userAnswers = sessionData.answers || {};
        flaggedQuestions = sessionData.flags || {};
        currentQuestionIndex = sessionData.qIndex || 0;
        timeLeft = sessionData.timeLeft !== undefined ? sessionData.timeLeft : testDuration;

        document.getElementById("login-screen").style.display = "none";
        document.getElementById("exam-screen").style.display = "block";
        document.getElementById("student-display-name").innerText = currentStudentName;

        loadNavGrid();
        Object.keys(userAnswers).forEach(qId => {
            let box = document.getElementById(`nav_${qId}`);
            if (box) box.classList.add("answered");
        });
        Object.keys(flaggedQuestions).forEach(qId => {
            let box = document.getElementById(`nav_${qId}`);
            if (box) box.classList.add("flagged");
        });

        renderCurrentQuestion();
        startTimer(timeLeft);
    }
});

function openAdminLogin() {
    let pass = prompt("Admin şifrəsini daxil edin:");
    if (pass === ADMIN_PASS) {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("exam-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "none";
        document.getElementById("admin-panel").style.display = "block";
        loadAdminResults();
    } else if (pass !== null) {
        alert("Yanlış şifrə!");
    }
}

function closeAdminPanel() {
    document.getElementById("admin-panel").style.display = "none";
    document.getElementById("login-screen").style.display = "block";
    window.location.hash = "";
}

function startExam() {
    const nameInput = document.getElementById("user-name").value.trim();
    const tokenInput = document.getElementById("user-token").value.trim().toUpperCase();
    const errorMsg = document.getElementById("error-msg");

    if (nameInput === "") {
        errorMsg.innerText = "Ad və soyadınızı daxil edin!";
        return;
    }
    if (!validTokens.includes(tokenInput)) {
        errorMsg.innerText = "Yanlış unikal kod!";
        return;
    }

    currentStudentName = nameInput;
    currentActiveToken = tokenInput;
    userAnswers = {};
    flaggedQuestions = {};
    currentQuestionIndex = 0;
    timeLeft = testDuration;
    examFinished = false;

    document.getElementById("student-display-name").innerText = currentStudentName;
    saveSessionState();

    document.getElementById("login-screen").style.display = "none";
    document.getElementById("exam-screen").style.display = "block";

    loadNavGrid();
    renderCurrentQuestion();
    startTimer(timeLeft);
}

function saveSessionState() {
    if (examFinished) return;
    let sessionData = {
        name: currentStudentName,
        token: currentActiveToken,
        answers: userAnswers,
        flags: flaggedQuestions,
        qIndex: currentQuestionIndex,
        timeLeft: timeLeft
    };
    sessionStorage.setItem("active_exam_session", JSON.stringify(sessionData));
}

function toggleSidebar() {
    const grid = document.getElementById("grid-nav-container");
    const btn = document.getElementById("toggle-btn");
    if (grid.classList.contains("collapsed")) {
        grid.classList.remove("collapsed");
        btn.innerText = "Yığ [-]";
    } else {
        grid.classList.add("collapsed");
        btn.innerText = "Aç [+]";
    }
}

function backToReviewQuestions() {
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("exam-screen").style.display = "block";
    currentQuestionIndex = 0;
    renderCurrentQuestion();
}

function loadNavGrid() {
    const gridContainer = document.getElementById("grid-nav-container");
    gridContainer.innerHTML = "";

    allQuestions.forEach((q, idx) => {
        let box = document.createElement("div");
        box.className = "nav-box";
        box.id = `nav_${q.id}`;
        box.innerText = q.id;

        if (userAnswers[q.id] !== undefined) box.classList.add("answered");
        if (flaggedQuestions[q.id]) box.classList.add("flagged");
        if (idx === currentQuestionIndex) box.classList.add("current");

        box.onclick = () => jumpToQuestion(idx);
        gridContainer.appendChild(box);
    });
}

function renderCurrentQuestion() {
    const q = allQuestions[currentQuestionIndex];
    const container = document.getElementById("single-question-container");
    const isFlagged = flaggedQuestions[q.id] ? "checked" : "";
    const userAns = userAnswers[q.id];

    let letters = ["A", "B", "C", "D", "E"];
    let imgHtml = q.image ? `<img src="${q.image}" alt="Sual ${q.id} şəkli" class="question-img">` : "";

    let optionsHtml = q.options.map((opt, i) => {
        let checked = userAns === i ? "checked" : "";
        let disabled = examFinished ? "disabled" : "";
        return `
            <label>
                <input type="radio" name="option_${q.id}" value="${i}" ${checked} ${disabled} onchange="selectOption(${q.id}, ${i})">
                <strong>${letters[i]})</strong> ${opt}
            </label>
        `;
    }).join("");

    let clearBtnHtml = (!examFinished && userAns !== undefined) 
        ? `<button class="clear-option-btn" onclick="clearOption(${q.id})">Cavabı Təmizlə</button>` 
        : "";

    container.innerHTML = `
        <div class="question-top">
            <span style="font-size: 13px; color: #64748b; font-weight: bold;">Sual ${q.id} / ${allQuestions.length} (${q.subject})</span>
            <label class="flag-label" style="cursor:pointer; font-size:13px;">
                <input type="checkbox" onchange="toggleFlag(${q.id})" ${isFlagged} ${examFinished ? 'disabled' : ''}>
                🚩 Nişanla
            </label>
        </div>
        <div class="question-title">${q.question}</div>
        ${imgHtml}
        <div class="options">${optionsHtml}</div>
        ${clearBtnHtml}
    `;

    document.querySelectorAll(".nav-box").forEach(el => el.classList.remove("current"));
    let curNav = document.getElementById(`nav_${q.id}`);
    if (curNav) curNav.classList.add("current");

    saveSessionState();
}

function selectOption(qId, optIdx) {
    if (examFinished) return;
    userAnswers[qId] = optIdx;
    let navBox = document.getElementById(`nav_${qId}`);
    if (navBox) navBox.classList.add("answered");
    renderCurrentQuestion();
}

function clearOption(qId) {
    if (examFinished) return;
    delete userAnswers[qId];
    let navBox = document.getElementById(`nav_${qId}`);
    if (navBox) navBox.classList.remove("answered");
    renderCurrentQuestion();
}

function toggleFlag(qId) {
    if (flaggedQuestions[qId]) {
        delete flaggedQuestions[qId];
    } else {
        flaggedQuestions[qId] = true;
    }
    let navBox = document.getElementById(`nav_${qId}`);
    if (navBox) navBox.classList.toggle("flagged");
    saveSessionState();
}

function prevQuestion() {
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderCurrentQuestion();
    }
}

function nextQuestion() {
    if (currentQuestionIndex < allQuestions.length - 1) {
        currentQuestionIndex++;
        renderCurrentQuestion();
    }
}

function jumpToQuestion(index) {
    currentQuestionIndex = index;
    renderCurrentQuestion();
}

function startTimer(duration) {
    clearInterval(timerInterval);
    timeLeft = duration;

    timerInterval = setInterval(() => {
        timeLeft--;
        let h = Math.floor(timeLeft / 3600);
        let m = Math.floor((timeLeft % 3600) / 60);
        let s = timeLeft % 60;

        document.getElementById("timer").innerText = 
            `${h < 10 ? '0'+h : h}:${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;

        if (timeLeft % 5 === 0) saveSessionState();

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            alert("Vaxt bitdi! Cavablarınız təsdiqlənir.");
            finishExam();
        }
    }, 1000);
}

function confirmFinish() {
    if (confirm("İmtahanı bitirmək istədiyinizdən əminsiniz?")) {
        finishExam();
    }
}

// İmtahanı Yekunlaşdırmaq və Supabase-ə Yazmaq
async function finishExam() {
    examFinished = true;
    clearInterval(timerInterval);
    sessionStorage.removeItem("active_exam_session");

    document.getElementById("exam-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";
    document.getElementById("res-name").innerText = currentStudentName;

    let subjects = ["Azərbaycan dili", "Qanunvericilik", "İnformatika", "Məntiq"];
    let stats = {
        totalCorrect: 0,
        totalWrong: 0,
        totalBlank: 0,
        score: 0
    };

    let reportHtml = "";
    let letters = ["A", "B", "C", "D", "E"];

    subjects.forEach(subj => {
        let subjQuestions = allQuestions.filter(q => q.subject === subj);
        if(subjQuestions.length === 0) return;

        let tableRows = "";
        let subjCorrect = 0, subjWrong = 0, subjBlank = 0;

        subjQuestions.forEach(q => {
            let uAns = userAnswers[q.id];
            let userAnsChar = uAns !== undefined ? letters[uAns] : "-";
            let correctChar = letters[q.correct];
            let statusClass = "";

            if (uAns === undefined) {
                subjBlank++;
                stats.totalBlank++;
                statusClass = "";
            } else if (uAns === q.correct) {
                subjCorrect++;
                stats.totalCorrect++;
                stats.score++;
                statusClass = "ans-correct";
            } else {
                subjWrong++;
                stats.totalWrong++;
                statusClass = "ans-wrong";
            }

            tableRows += `
                <tr>
                    <td>${q.id}</td>
                    <td class="${statusClass}">${userAnsChar}</td>
                    <td>${correctChar}</td>
                </tr>
            `;
        });

        reportHtml += `
            <div class="subject-section">
                <div style="font-weight: bold; margin-bottom: 5px;">${subj}</div>
                <table class="dim-table">
                    <thead>
                        <tr>
                            <th>N</th>
                            <th>Sizin cavab</th>
                            <th>Doğru cavab</th>
                        </tr>
                    </thead>
                    <tbody>${tableRows}</tbody>
                </table>
            </div>
        `;
    });

    document.getElementById("dim-report-content").innerHTML = reportHtml;
    document.getElementById("res-total-correct").innerText = stats.totalCorrect;
    document.getElementById("res-total-wrong").innerText = stats.totalWrong;
    document.getElementById("res-total-blank").innerText = stats.totalBlank;
    document.getElementById("res-total-score").innerText = stats.score;

    let groupText = "";
    if (stats.score >= 80) groupText = "Uyğun Qrup: BB1 (Yüksək İnzibati)";
    else if (stats.score >= 70) groupText = "Uyğun Qrup: BB2";
    else if (stats.score >= 60) groupText = "Uyğun Qrup: BB3";
    else if (stats.score >= 50) groupText = "Uyğun Qrup: BB4 (Mövqe Tələbini Ödəyir)";
    else groupText = "Müvafiq Keçid Balı Toplanmamışdır";

    document.getElementById("res-bb-group").innerText = groupText;

    // Nəticənin Supabase "results" cədvəlinə əlavə edilməsi
    const { data, error } = await supabase
        .from('results')
        .insert([
            {
                name: currentStudentName,
                token: currentActiveToken,
                correct: stats.totalCorrect,
                wrong: stats.totalWrong,
                blank: stats.totalBlank,
                score: stats.score,
                group: groupText
            }
        ]);

    if (error) {
        console.error("Supabase xətası:", error.message);
    }
}

// Admin Paneli Məlumatlarını Supabase-dən Yükləmək
async function loadAdminResults() {
    const tableBody = document.getElementById("results-table-body");
    tableBody.innerHTML = "<tr><td colspan='6'>Məlumatlar yüklənir...</td></tr>";

    const { data, error } = await supabase
        .from('results')
        .select('*')
        .order('created_at', { ascending: false });

    if (error) {
        tableBody.innerHTML = `<tr><td colspan='6' style='color:red;'>Xəta baş verdi: ${error.message}</td></tr>`;
        return;
    }

    tableBody.innerHTML = "";
    if (!data || data.length === 0) {
        tableBody.innerHTML = "<tr><td colspan='6'>Hələ heç bir nəticə yoxdur.</td></tr>";
        document.getElementById("stat-total-students").innerText = "0";
        document.getElementById("stat-max-score").innerText = "0";
        document.getElementById("stat-avg-score").innerText = "0";
        return;
    }

    let totalStudents = data.length;
    let maxScore = 0;
    let sumScore = 0;

    data.forEach(res => {
        if (res.score > maxScore) maxScore = res.score;
        sumScore += res.score;

        let row = document.createElement("tr");
        row.innerHTML = `
            <td>${res.name}</td>
            <td>${res.token}</td>
            <td style="color: green; font-weight: bold;">${res.correct}</td>
            <td style="color: red; font-weight: bold;">${res.wrong}</td>
            <td style="font-weight: bold;">${res.score}</td>
            <td>${res.group}</td>
        `;
        tableBody.appendChild(row);
    });

    document.getElementById("stat-total-students").innerText = totalStudents;
    document.getElementById("stat-max-score").innerText = maxScore;
    document.getElementById("stat-avg-score").innerText = (sumScore / totalStudents).toFixed(1);
}

// Admin Paneli: Nəticələri Təmizləmək
async function clearResults() {
    if (confirm("Bütün iştirakçı nəticələrini silməkdən əminsiniz?")) {
        const { error } = await supabase
            .from('results')
            .delete()
            .neq('id', 0);

        if (error) {
            alert("Nəticələr silinərkən xəta: " + error.message);
        } else {
            alert("Bütün nəticələr təmizləndi.");
            loadAdminResults();
        }
    }
}
</script>
