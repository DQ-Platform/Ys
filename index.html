<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DQ Platform - Sınaq İmtahanı</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #ffffff; width: 100%; max-width: 480px; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); text-align: center; }
    h2 { font-size: 20px; color: #1a237e; margin-bottom: 8px; }
    p.subtitle { font-size: 13px; color: #666; margin-bottom: 24px; }
    .input-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-size: 12px; font-weight: 600; color: #333; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; transition: 0.2s; }
    input:focus { border-color: #1a237e; box-shadow: 0 0 0 3px rgba(26,35,126,0.1); }
    .btn { width: 100%; padding: 12px; background-color: #0d1b2a; color: #d4af37; font-weight: bold; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; transition: 0.2s; margin-top: 8px; }
    .btn:hover { background-color: #1b263b; }
    .footer-text { margin-top: 24px; font-size: 11px; color: #888; }
    .hidden { display: none; }
    .question-box { text-align: left; font-size: 16px; margin-bottom: 20px; }
  </style>
</head>
<body>

  <!-- GİRİŞ FORMU -->
  <div id="login-card" class="card">
    <h2>DQ Platform - Dövlət Qulluğu Sınaq İmtahanı</h2>
    <p class="subtitle">Zəhmət olmasa məlumatlarınızı daxil edin</p>
    
    <form id="exam-form">
      <div class="input-group">
        <label for="fullname">Ad və Soyadınız</label>
        <input type="text" id="fullname" placeholder="Məs: Yunis İmanov" required>
      </div>
      <div class="input-group">
        <label for="passcode">İştirak Kodu</label>
        <input type="text" id="passcode" placeholder="Məs: PSG1562" required>
      </div>
      <button type="submit" class="btn">İmtahana Başla</button>
    </form>

    <div class="footer-text">© 2026 DQ Platform – Developed by Yunis İmanov</div>
  </div>

  <!-- İMTAHAN SƏHİFƏSİ (İlkin olaraq gizlidir) -->
  <div id="exam-card" class="card hidden">
    <h2 id="welcome-msg"></h2>
    <div id="quiz-container" style="margin-top: 20px;">
      <!-- Suallar bura yüklənəcək -->
    </div>
  </div>

  <script>
    // 1. Suallar massivi (İstədiyiniz zaman bura sual əlavə edə bilərsiniz)
    const questions = [];

    // 2. Form təqdim ediləndə işləyən kod
    document.getElementById('exam-form').addEventListener('submit', function(event) {
      event.preventDefault(); // Səhifənin yenilənməsinin qarşısını alır

      const fullname = document.getElementById('fullname').value.trim();
      const passcode = document.getElementById('passcode').value.trim();

      if (!fullname || !passcode) {
        alert("Zəhmət olmasa bütün xanaları doldurun!");
        return;
      }

      // Sualların olub-olmamasını yoxlayırıq
      if (questions.length === 0) {
        alert("Sistemə daxil oldunuz! Lakin hal-hazırda bazada heç bir sual yoxdur.");
      } else {
        alert("İmtahan başlayır!");
      }

      // Ekranı dəyişdiririk
      document.getElementById('login-card').classList.add('hidden');
      document.getElementById('exam-card').classList.remove('hidden');
      document.getElementById('welcome-msg').innerText = "Xoş gəldiniz, " + fullname;
      
      loadQuiz();
    });

    // 3. Sualları ekrana çıxaran funksiya
    function loadQuiz() {
      const container = document.getElementById('quiz-container');
      if (questions.length === 0) {
        container.innerHTML = "<p style='color: #666;'>Aktiv sual tapılmadı.</p>";
        return;
      }

      let html = "";
      questions.forEach((q, index) => {
        html += `<div class="question-box"><p><b>${index + 1}. ${q.question}</b></p></div>`;
      });
      container.innerHTML = html;
    }
  </script>
</body>
</html>
